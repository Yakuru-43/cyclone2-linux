[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclone2"
version = "0.1.0"
description = "Configure the GameSir Cyclone 2 controller from Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Standard library only: hidraw is accessed directly.
dependencies = []

[project.urls]
Homepage = "https://github.com/Yakuru-43/cyclone2-linux"
Protocol = "https://github.com/Yakuru-43/cyclone2-linux/blob/main/PROTOCOL.md"

[project.scripts]
cyclone2 = "cyclone2.cli:main"

[tool.setuptools]
packages = ["cyclone2"]
